<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoteSearch</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 4px; }
    .sub { color: #666; margin-top: 0; }
    form { display: flex; gap: 8px; margin: 24px 0; }
    input[type=text] { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 18px; font-size: 16px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; }
    .result { margin-bottom: 20px; }
    .result h3 { margin: 0; }
    .score { color: #888; font-size: 14px; }
    .snippet { margin: 4px 0 0; color: #444; }
  </style>
</head>
<body>
  <h1>NoteSearch</h1>
  <p class="sub">Searching {{ note_count }} notes</p>

  <form method="get" action="/">
    <input type="text" name="q" value="{{ query }}" placeholder="Search your notes..." autofocus>
    <button type="submit">Search</button>
  </form>

  {% if query %}
    {% if results %}
      <p>{{ results|length }} result(s) for "{{ query }}"</p>
      {% for r in results %}
        <div class="result">
          <h3>{{ r.filename }} <span class="score">score {{ r.score }}</span></h3>
          <p class="snippet">{{ r.snippet }}</p>
        </div>
      {% endfor %}
    {% else %}
      <p>No results found for "{{ query }}".</p>
    {% endif %}
  {% endif %}
</body>
</html>
